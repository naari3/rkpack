name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Check tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $meta = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $version = ($meta.packages | Where-Object name -eq 'rkpack').version
          if ($tag -ne "v$version") {
            Write-Error "tag $tag does not match Cargo.toml version v$version"
            exit 1
          }

      - name: Build and package
        shell: pwsh
        run: pwsh scripts/package.ps1

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: rkpack-windows
          path: dist/*.zip
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $zips = Get-ChildItem dist/*.zip | ForEach-Object { $_.FullName }
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @zips --clobber
          } else {
            gh release create $tag @zips --verify-tag --generate-notes --title $tag
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
